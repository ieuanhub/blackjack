<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blackjack</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- INTRODUCTION SCREEN -->
    <section class="intro-screen" id="introScreen">
        <div class="intro-content">
            <p class="intro-name">ROYAL</p>
            <h1>BLACKJACK</h1>
            <div class="intro-subtitle">
                <span></span>
                <p>VEGAS</p>
                <span></span>
            </div>
            <button id="startButton" class="start-button">
                START
            </button>
        </div>
        <p class="intro-footer">THE GITHUB PORTFOLIO CASINO EXPERIENCE</p>
    </section>

    <!-- GAME SCREEN -->
     <main class="game-screen" id="gameScreen">

     <!-- TOP CORNER INFORMATION -->
      <header class="game-header">
        <div class="bet-limits">
            BET LIMITS: £0.10 - £10,000.00
        </div>

        <div class="balance-display">
            BALANCE <span id="balance">£0.00</span>
        </div>
      </header>

      <!-- THE TABLE -->
       <section class="table">

        <div class="table-branding">
            <p class="table-brand">ROYAL</p>
            <h2>BLACKJACK</h2>
            <p class="table-vegas">VEGAS</p>
            <p class="table-rules">PAYS 3 TO 2</p>
            <p class="dealer-rules">Dealer must stand on all 17s</p>
        </div>

        <!-- DEALER'S CARDS -->
         <div class="dealer-area">
            <p>DEALER</p>

            <div class="card-container" id="dealerCards">
            </div>
         </div>

         <!-- PLAYER BETTING POSITIONS -->
          <div class="betting-spots">

            <div class="bet-spot">
                <p class="bet-label">BET<br>HERE</p>
                <div class="side-bets">
                    <span>PERFECT PAIRS</span>
                    <span>21+3</span>
                </div>
            </div>

            <div class="bet-spot active-spot">
                <p class="bet-label">BET<br>HERE</p>
                <div class="side-bets">
                    <span>PERFECT PAIRS</span>
                    <span>21+3</span>
                </div>
            </div>

            <div class="bet-spot">
                <p class="bet-label">BET<br>HERE</p>
                <div class="side-bets">
                    <span>PERFECT PAIRS</span>
                    <span>21+3</span>
                </div>
            </div>

          </div>
        
        <!-- PLAYER CARDS -->
            <div class="player-area">
                <div class="card-container" id="playerCards">
                </div>
            </div>
        
         <!-- CHIP SELECTION -->
            <div class="chip-selector">

                <button class="chip chip-red" data-value="10">
                    0.10
                </button>

                <button class="chip chip-purple" data-value="50">
                    0.50
                </button>

                <button class="chip chip-black selected" data-value="100">
                    1
                </button>

                <button class="chip chip-green" data-value="200">
                    2
                </button>

                <button class="chip chip-blue" data-value="500">
                    5
                </button>

                <button class="chip chip-gold" data-value="1000">
                    10
                </button>

            </div>

            <div class="current-bet">
                CURRENT BET: <span id="currentBet">£0.00</span>
            </div>

       </section>

        <!-- TABLE CONTROLS -->
        <div class="settings-button">
            ⚙
        </div>

    </main>

</body>
</html>
